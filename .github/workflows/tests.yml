name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit and smoke tests (fake detector, no weights)
        run: python -m pytest -q
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build optional native backend
        run: bash cpp/build_hungarian.sh
      - name: Install lightweight test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test native/SciPy parity
        run: python -m pytest -q
